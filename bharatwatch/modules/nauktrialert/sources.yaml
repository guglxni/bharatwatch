module: nauktrialert
name: NaukriAlert
sources:
  - name: ssc-local-mirror
    url: https://frequency-mysterious-instrumentation-dylan.trycloudflare.com
    collector_id: c_mt0srxto15g4to0is3
    status: healthy
    prompt: |
      Extract all recruitment notices from this single page only. Do NOT navigate to any links.
      For each notice, return: title, department, notification_date, last_application_date,
      exam_date, number_of_vacancies, qualification_required, and official_link.
      Return as a flat JSON array.

  - name: ssc-official
    url: https://ssc.nic.in
    collector_id: c_mt0rka4dabzawc1zq
    status: pending
    prompt: |
      Extract all job notifications and recruitment notices from this page. For each item, return:
      title, organization, notification_date, last_application_date, exam_date,
      number_of_vacancies, qualification_required, and official_link. Return as a JSON array.
